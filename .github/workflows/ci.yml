name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. Each push to main
  # gets a group of its own (its SHA), so none is cancelled, even while pending.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Skills mirror
        run: uv run --locked python scripts/sync_agents.py --check

      - name: Ruff check
        run: uv run --locked ruff check .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: mypy
        run: uv run --locked mypy src scripts tests

      # Mirrors `just test-skills`; the .claude/skills mirror is not run twice.
      - name: Skill script tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          status=0
          for dir in .agents/skills/*/scripts/tests; do
            echo "== $dir"
            uv run --locked python -m unittest discover -s "$dir" -t "$dir" -p 'test_*.py' || status=1
          done
          exit "$status"

  test:
    name: Test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev --locked

      # `just test` isn't used directly, so `-n auto` is specified here as well
      # as in the justfile; it tracks the runner's actual core count. Coverage
      # thresholds are only checked once all shards' data has been combined.
      - name: Run tests
        env:
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
        run: >-
          uv run --locked pytest
          --splits 4
          --group ${{ matrix.shard }}
          --durations-path .test_durations
          -n auto
          --cov
          --cov-report=

      - name: Upload shard coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Coverage
    # Always runs (unless cancelled) so a failed shard fails this required
    # check instead of skipping it, which a ruleset would count as passing.
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail when a test shard did not succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::test shards finished with result: $TEST_RESULT"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Download shard coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and validate coverage
        run: |
          uv run --locked coverage combine
          uv run --locked coverage report --fail-under=80

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Spell check
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3
        with:
          config: typos.toml

  zizmor:
    name: Workflow Security Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx zizmor .github/workflows/

  # <!-- template-only -->
  # Bootstraps a scratch clone of the commit under test as a sample app, so the
  # bootstrap cannot rot unnoticed. scripts/bootstrap.py removes this job from the
  # app it creates, so it is deliberately not a required check.
  bootstrap-smoke:
    name: Template Bootstrap Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the bootstrap finds the template's first commit and
          # records this commit in .template-origin.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      # The bootstrap needs a git work tree (its clean-tree check, `git ls-files`).
      - name: Bootstrap a scratch clone with sample values
        run: |
          git clone --quiet "$GITHUB_WORKSPACE" "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          uv run --locked python scripts/bootstrap.py todo-api \
            --author "Jane Doe" --github-user jdoe --github-repository jdoe/todo-api \
            --description "Todo API" --contact-url https://github.com/jdoe

      - name: Assert no placeholder survived
        run: |
          cd "$RUNNER_TEMP/app"
          # Stage everything (ignored files stay out) so git grep sees new files.
          git add --all
          # .template-origin names the template repository on purpose. The
          # tokens never occur inside ordinary words, so any case is a leftover;
          # the display placeholders are matched as whole words, as the
          # template's sites spell them.
          status=0
          if git grep --cached -n -I -i -E 'my-app|my_app|uv-template|your-username|you@example' -- . ':!.template-origin'; then
            echo "::error::the bootstrap left a placeholder token on the lines above"; status=1
          fi
          if git grep --cached -n -I -w -E 'My App|Your Name' -- . ':!.template-origin'; then
            echo "::error::the bootstrap left a display placeholder on the lines above"; status=1
          fi
          for path in TEMPLATE.md scripts/bootstrap.py tests/test_bootstrap.py src/my_app \
            .agents/skills/starting-an-app/references/bootstrap.md; do
            if [ -e "$path" ]; then echo "::error::$path survived the bootstrap"; status=1; fi
          done
          grep -qx 'ENV_PREFIX = "TODO_API_"' src/todo_api/settings.py || { echo "::error::env prefix not renamed"; status=1; }
          grep -qE '^commit: [0-9a-f]{40}$' .template-origin || { echo "::error::.template-origin lacks the template commit"; status=1; }
          if grep -rn -e 'template-only' -e 'Template Bootstrap Smoke' .github .agents .claude AGENTS.md README.md; then
            echo "::error::template-only material survived"; status=1
          fi
          exit "$status"

      - name: Assert the Product check fails on the unfilled section
        run: |
          cd "$RUNNER_TEMP/app"
          if uv run --locked pytest -q tests/test_product_section.py >"$RUNNER_TEMP/product.log" 2>&1; then
            cat "$RUNNER_TEMP/product.log"
            echo "::error::tests/test_product_section.py passed on an app whose Product section is still TODO"
            exit 1
          fi
          if ! grep -qF 'TODO: left in the Product section' "$RUNNER_TEMP/product.log"; then
            cat "$RUNNER_TEMP/product.log"
            echo "::error::tests/test_product_section.py failed, but not for the unfilled Product section"
            exit 1
          fi

      - name: Fill the Product section
        run: |
          cd "$RUNNER_TEMP/app"
          sed -i '/^## Product$/,/^## [A-Z]/ s/TODO: /Filled in by the smoke job: /' AGENTS.md
          if sed -n '/^## Product$/,/^## [A-Z]/p' AGENTS.md | grep -F 'TODO:'; then
            echo "::error::a TODO: survived in the Product section"
            exit 1
          fi

      - name: just verify
        run: |
          cd "$RUNNER_TEMP/app"
          uvx --from rust-just==1.47.1 just verify
  # <!-- /template-only -->
