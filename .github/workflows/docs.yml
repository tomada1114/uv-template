name: Docs

on:
  push:
    branches: [main]
    paths:
      - "CONTRIBUTING.md"
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # gh-deploy pushes the built site, so this job is the one place that
      # needs the persisted checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group docs --locked

      - name: Build docs strictly
        run: uv run mkdocs build --strict

      - name: Build & deploy
        run: uv run mkdocs gh-deploy --force
