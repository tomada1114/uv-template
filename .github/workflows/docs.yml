name: Docs

on:
  push:
    branches: [main]
    paths:
      - "CONTRIBUTING.md"
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # gh-deploy pushes the built site, so this job is the one place that
      # needs the persisted checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group docs --locked

      - name: Build docs strictly
        run: uv run --locked mkdocs build --strict

      - name: Build & deploy
        run: uv run --locked mkdocs gh-deploy --force
