[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-package"
version = "0.1.0"
description = "A short description of the project."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/your-username/uv-template"
Documentation = "https://your-username.github.io/uv-template"
Repository = "https://github.com/your-username/uv-template"
Issues = "https://github.com/your-username/uv-template/issues"
Changelog = "https://github.com/your-username/uv-template/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-split>=0.11",
    "pytest-xdist>=3.6",
    "ruff>=0.15.22",
]
docs = ["mkdocs-material>=9.7.6", "mkdocstrings[python]>=1.0.6"]

# --------------------------------------------------------------------------- #
#  uv
# --------------------------------------------------------------------------- #

[tool.uv]
exclude-newer = "2026-07-21T00:00:00Z"

# --------------------------------------------------------------------------- #
#  Build
# --------------------------------------------------------------------------- #

[tool.hatch.build.targets.wheel]
packages = ["src/my_package"]

# --------------------------------------------------------------------------- #
#  Ruff – linter & formatter
# --------------------------------------------------------------------------- #

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests", "scripts"]
# The generated skills mirror is linted through its source, .agents/skills.
extend-exclude = [".claude/skills"]

# Skill scripts run under whatever `python3` the host provides, which may be
# older than the project's own 3.14 floor. Pin them below the project
# target-version so neither the formatter nor version-specific lint rules
# introduce syntax (e.g. PEP 758 unparenthesized `except`) that would be a
# SyntaxError there. `**` so a skill's bundled `scripts/tests/` is pinned too:
# those tests import the scripts and run under the same interpreters.
[tool.ruff.per-file-target-version]
".agents/skills/*/scripts/**/*.py" = "py312"

[tool.ruff.lint]
select = [
    # --- Core ---
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    # --- Modern Python ---
    "UP",   # pyupgrade
    # --- Bug prevention ---
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    # --- Code quality ---
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint
    # --- Performance ---
    "PERF", # perflint
    "FURB", # refurb
    # --- Type checking ---
    "TC",   # flake8-type-checking
    # --- Style ---
    "COM",  # flake8-commas
    "PTH",  # flake8-use-pathlib
    "SLF",  # flake8-self
    "T20",  # flake8-print
    "LOG",  # flake8-logging
    # --- Documentation ---
    "D",    # pydocstyle
    # --- Testing ---
    "PT",   # flake8-pytest-style
    # --- Naming ---
    "N",    # pep8-naming
    # --- Error handling ---
    "TRY",  # tryceratops
    "EM",   # flake8-errmsg
    # --- Datetime safety ---
    "DTZ",  # flake8-datetimez
    # --- Exception hygiene ---
    "RSE",  # flake8-raise
    # --- pygrep hooks ---
    "PGH",  # pygrep-hooks
    # --- Ruff-specific ---
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "COM812", # missing trailing comma — conflicts with formatter
    "ISC001", # implicit string concatenation — conflicts with formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is fine in tests
    "ARG001",  # unused arguments (fixtures)
    "PLR2004", # magic numbers in tests
    "T20",     # print in tests
    "D1",      # missing docstrings — test names are self-documenting
]
"scripts/**" = [
    "D1",  # missing docstrings — scripts are not a public API
    "T20", # print is the expected output channel for CLI scripts
]
# Skill scripts are ported from the sibling templates (nextjs-app-template and
# others) and kept close to that source, so a later sync stays a small diff
# rather than a rewrite. They are stdlib-only CLI tools run with the system
# `python3` and tested with unittest, never part of the package's public API.
# The ignores below name only the style differences that follow from that;
# they waive nothing for src/, scripts/ or tests/.
".agents/skills/**/scripts/**" = [
    "D1",      # missing docstrings — CLI helpers, not a public API
    "D2",      # docstring layout (D205/D209) — kept as authored upstream
    "T20",     # print is the CLI's output channel
    "S603",    # subprocess with an argv list built from fixed commands (gh, git)
    "S607",    # `gh`/`git` resolved from PATH on purpose, like a shell would
    "PLW1510", # subprocess.run callers check returncode themselves
    "B904",    # re-raised SystemExit carries the user-facing message on its own
    "E402",    # sys.path set up before a sibling-script import
    "I001",    # import order kept as authored upstream
    "ISC003",  # explicit concatenation kept as authored upstream
    "PLR0911", # long dispatch functions mirror the documented exit codes
    "PLR0912",
    "PLR0915",
    "PLR2004", # exit codes and limits are documented in each script's header
    "PLW0603", # module-level CLI state set once from argv
    "RUF001",  # deliberate typographic characters in user-facing output
    "TC003",   # runtime imports kept simple in stdlib-only scripts
    "DTZ011",  # an issue's age in local days is approximate by design
    "UP017",   # timezone.utc spelling kept as authored upstream
    "UP031",   # printf-style formatting kept as authored upstream
]
".agents/skills/**/scripts/tests/**" = [
    "D",       # test names are self-documenting
    "PT",      # unittest.TestCase style: the tests run without pytest
    "S108",    # fixture paths under /tmp are never written
    "SLF001",  # tests reach a script's private helpers on purpose
    "N802",    # unittest's setUp/tearDown-style method names
    "E741",
    "EM102",
    "TRY003",
    "F401",
    "C420",
    "PLC0415", # imports inside a test keep a fixture's module load local
    "PLR0913",
    "PLW2901",
    "RUF005",
    "RUF059",  # unpacked-but-unused results document the call's shape
    "RUF100",  # `noqa: E402` kept from upstream, where E402 is not ignored
    "SIM117",
    "UP037",
]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
# Ported skill scripts keep their upstream layout (see the per-file-ignores
# above); reformatting them would turn every later sync into a full rewrite.
exclude = [".agents/skills/*/scripts/**"]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------------- #
#  mypy – strict type checking
# --------------------------------------------------------------------------- #

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-cast", "truthy-bool"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

# --------------------------------------------------------------------------- #
#  pytest
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
]

# --------------------------------------------------------------------------- #
#  coverage
# --------------------------------------------------------------------------- #

[tool.coverage.run]
branch = true
# Single-sources the measured package: `--cov` alone then needs no name, so
# the justfile / CI / CONTRIBUTING commands survive the bootstrap rename.
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
