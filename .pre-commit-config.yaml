# A merge that completes without conflicts commits through git's
# pre-merge-commit hook, never pre-commit, so both are installed for the
# secret gate below. Every other hook keeps running at pre-commit only.
default_install_hook_types: [pre-commit, pre-merge-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos
        args: ["--config", "typos.toml"]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      # Reads the index itself (scripts/check_staged.py), so it takes no
      # filenames and runs on every commit -- ordinary, merge, and a
      # `git commit` at a rebase stop -- whatever pre-commit would pass it.
      - id: check-staged
        name: refuse staged secrets
        entry: uv run --locked python scripts/check_staged.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]
      # Judges the working tree, so a commit that stages only one of the two
      # skills trees still passes here; CI and `just verify` judge the commit.
      - id: agents-check
        name: skills mirror matches .agents/skills
        entry: uv run --locked python scripts/sync_agents.py --check
        language: system
        files: ^\.(agents|claude)/skills/
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --locked mypy src scripts tests
        language: system
        types: [python]
        pass_filenames: false
